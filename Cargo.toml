[package]
name = "alyx-examples"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[workspace]
members = [
    "crates/alyx-compiler", 
    "crates/alyx-core",
    "crates/alyx-ir",
    "crates/alyx-plan",
    "crates/alyx-widgets",
    "crates/alyx-executor",
    "crates/alyx-runtime",
    "crates/alyx-web",
    "crates/alyx-host",
    "crates/alyx-native",
    "crates/alyx-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naoshinn/alyx-core"
version = "0.1.0"

[dependencies]
alyx-core = { path = "crates/alyx-core" }
alyx-executor = { path = "crates/alyx-executor" }
