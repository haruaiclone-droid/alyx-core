[package]
name = "alyx-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alyx-plan = { path = "../alyx-plan" }
alyx-ir = { path = "../alyx-ir" }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomStringMap",
    "console",
    "EventTarget",
] }
js-sys = "0.3"
