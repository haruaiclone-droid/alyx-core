name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - cargo fmt --all -- --check
          - cargo clippy --workspace --all-targets --all-features -- -D warnings
          - cargo test --workspace --all-features
          - cargo build --workspace --all-features
          - cargo run --package alyx-cli -- --help
          - cargo run --package alyx-cli -- build-web dist
          - cargo doc --workspace --no-deps --all-features
          - cargo check --package alyx-native --example native --features winit-backend --no-run
          - cargo check --package alyx-native --example native_pixels --features pixels-backend --no-run
          - cargo check --package alyx-native --example native_wgpu --features wgpu-backend --no-run
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run ${{ matrix.command }}
        run: ${{ matrix.command }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build all workspace for wasm
        run: cargo build --workspace --target wasm32-unknown-unknown

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build examples
        run: cargo build --workspace --examples
      - name: CLI build-web + serve smoke
        run: |
          set -euo pipefail
          port=38888
          max_wait_seconds=12
          cargo run --package alyx-cli -- build-web dist
          (
            cargo run --package alyx-cli -- serve "$port" dist > /tmp/alyx-serve.log 2>&1 &
            server_pid=$!
            trap 'kill $server_pid || true' EXIT
            for attempt in $(seq 1 "$max_wait_seconds"); do
              if curl -fsS "http://127.0.0.1:$port/" > /tmp/alyx-root.html 2>/dev/null; then
                break
              fi
              if [ "$attempt" -eq "$max_wait_seconds" ]; then
                cat /tmp/alyx-serve.log >&2 || true
                exit 1
              fi
              sleep 1
            done
            python3 - <<'PY'
import urllib.request

for path in ("/", "/index.html"):
    with urllib.request.urlopen(f"http://127.0.0.1:38888{path}", timeout=8) as response:
        if response.status != 200:
            raise SystemExit(f"unexpected status for {path}: {response.status}")
print("CLI smoke: serve endpoints reachable")
PY
            curl -fsS -X POST \
              -H "Content-Type: application/json" \
              -d '{"type":"click","x":32,"y":16}' \
              "http://127.0.0.1:38888/__alyx_event" >/tmp/alyx-event-click.json
            curl -fsS -X POST \
              -H "Content-Type: application/json" \
              -d '{"type":"keydown","key":"Enter"}' \
              "http://127.0.0.1:38888/__alyx_event" >/tmp/alyx-event-key.json
            if [ ! -s /tmp/alyx-event-click.json ] || [ ! -s /tmp/alyx-event-key.json ]; then
              echo "event endpoint smoke produced no payload"
              exit 1
            fi
            echo "CLI smoke: runtime event endpoint reachable"
          )

  browser-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build dist bundle for browser smoke
        run: cargo run --package alyx-cli -- build-web dist
      - name: Install Node + Playwright runner
        run: |
          npm install --no-save @playwright/test@1.47.0 playwright@1.47.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: CLI serve + browser event smoke
        run: |
          set -euo pipefail
          port=38888
          max_wait_seconds=12
          (
            cargo run --package alyx-cli -- serve "$port" dist > /tmp/alyx-serve.log 2>&1 &
            server_pid=$!
            trap 'kill $server_pid || true' EXIT
            for attempt in $(seq 1 "$max_wait_seconds"); do
              if curl -fsS "http://127.0.0.1:$port/" > /tmp/alyx-root.html 2>/dev/null; then
                break
              fi
              if [ "$attempt" -eq "$max_wait_seconds" ]; then
                cat /tmp/alyx-serve.log >&2 || true
                exit 1
              fi
              sleep 1
            done
            ALYX_BASE_URL="http://127.0.0.1:$port" \
              npx playwright test --config playwright.browser.config.js --project ${{ matrix.browser }} .github/browser-smoke/cli-event.spec.js
          )
